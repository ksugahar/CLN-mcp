name: Documentation validation
on: [push, pull_request]
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy sympy nbformat
      - run: python tools/policy_lint.py
      - run: python validation/validate_notebooks.py
      - run: python validation/validate_foster_cauer.py
      - run: python validation/surface_hybrid/validate_evidence.py
      - run: python validation/surface_hybrid/validate_same_excitation_3d.py
      - run: python validation/validate_research.py
      - run: python validation/validate_team28.py
      - run: python validation/validate_general_3d.py
      - run: python validation/validate_general_3d_air.py
