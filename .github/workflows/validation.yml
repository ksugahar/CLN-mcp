name: Documentation validation
on: [push, pull_request]
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy sympy==1.14.0 nbformat
      - run: python tools/policy_lint.py
      - run: python validation/input_ports_exact.py --output docs/data/input_ports_exact.json --check
      - run: python validation/validate_notebooks.py
      - run: python validation/validate_foster_cauer.py
      - run: python validation/surface_hybrid/validate_evidence.py
      - run: python validation/surface_hybrid/validate_same_excitation_3d.py
      - run: python validation/validate_research.py
      - run: python validation/validate_team28.py
      - run: python validation/validate_general_3d.py
      - run: python validation/validate_general_3d_air.py
      - run: python validation/validate_surface_air.py
      - run: python validation/validate_tomega_air.py
      - run: python validation/validate_c2_washer.py
      - run: python validation/validate_ac_axis.py

  package-contracts:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CLN_REQUIRE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set artifact output directory
        run: echo "CLN_BUILD_ARTIFACT_DIR=$RUNNER_TEMP/cln-artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' numpy hatchling packaging
      - name: Solver-free contracts (no CAS or build invocation)
        run: >-
          python -m pytest -q tests/test_server.py tests/test_knowledge_contracts.py
          tests/test_spice.py tests/test_version_metadata.py
          tests/test_backend_admissibility.py tests/test_slab_knowledge.py
          tests/test_artifact_contract.py tests/test_tiles.py
          -k 'not diffusion_derive_cylinder and not wheel_contains'
      - name: Required wheel and sdist checks
        run: |
          python -c "import hatchling"
          python -m pytest -q tests/test_server.py::test_wheel_contains_mathematica_package
      - name: Retain verified wheel, sdist and SHA256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: cln-packages-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLN_BUILD_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 30
