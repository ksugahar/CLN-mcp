[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CLN-mcp"
dynamic = ["version"]
description = "Cauer Ladder Network (CLN) with expansion point on NGSolve / radia-ngsolve, and an MCP knowledge server."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Kengo Sugahara", email = "ksugahar@ele.kindai.ac.jp"}]
keywords = ["mcp", "cauer-ladder-network", "model-order-reduction", "eddy-current", "ngsolve", "fem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
energy = ["numpy"]
solver = ["ngsolve", "numpy", "scipy", "radia"]
test = ["pytest", "tomli>=2; python_version < '3.11'"]

[project.scripts]
cln-mcp = "cln_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cln", "src/cln_mcp_server"]

[tool.hatch.version]
path = "src/cln/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["fe: requires finite-element mesh/solver execution and resource admission"]
